[project]
name = "eleicoes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
eleicoes = "eleicoes:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/bu_dump.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# cabeçalhos reais do TSE como listas literais
"tests/fixtures/gerar_tse.py" = ["E501"]
