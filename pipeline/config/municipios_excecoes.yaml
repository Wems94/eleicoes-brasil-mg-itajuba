# Municípios cujo nome no TSE não casa com o do IBGE (comparação por UF e nome sem
# acento, sem espaço e sem pontuação). Formato: UF -> nome como o TSE grava -> código
# IBGE de 7 dígitos. O gate de qualidade lista os casos sem correspondência, e o
# `scripts/validar_real.py` sugere os nomes do IBGE mais parecidos para completar aqui.
# Casos de 2018, 2022 e 2026 conferidos com a validação real de 2026-10-13.
#
# `sem_poligono`: códigos IBGE de municípios que existem nos dados mas ainda não
# têm polígono na malha do IBGE (ex.: criados depois da malha). Ficam fora do
# desenho, mas aparecem na tabela e no painel do mapa.
