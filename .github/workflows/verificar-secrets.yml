# Confere se os secrets funcionam, sem publicar nada e sem mostrar valores.
# O GitHub mascara os secrets nos logs; este workflow só imprime OK/ERRO e nomes.
name: Verificar secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motherduck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --frozen
      - name: Conectar ao MotherDuck com o código do pipeline
        run: |
          uv run python - <<'PY'
          import sys
          from eleicoes.motherduck import Sincronizador
          s = Sincronizador.do_ambiente()
          if not s.ativo:
              print("::error::MOTHERDUCK_TOKEN ausente ou vazio")
              sys.exit(1)
          try:
              existe = s.remoto.existe()
          except Exception as e:  # mensagem do MotherDuck, sem o token
              print(f"::error::Falha ao conectar no MotherDuck: {type(e).__name__}: {e}")
              sys.exit(1)
          print(f"OK: conectado ao MotherDuck; banco '{s.remoto.banco}' "
                f"{'já existe' if existe else 'ainda não existe (será criado no 1º ETL com token)'}")
          PY

  vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROJETO_ESPERADO: eleicoes-brasil-mg-itajuba
    steps:
      - name: Conferir token, org e projeto na API da Vercel
        run: |
          set -euo pipefail
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::$v ausente ou vazio"; exit 1; fi
          done
          case "$VERCEL_ORG_ID" in team_*) ;; *) echo "::error::VERCEL_ORG_ID deveria começar com team_"; exit 1;; esac
          case "$VERCEL_PROJECT_ID" in prj_*) ;; *) echo "::error::VERCEL_PROJECT_ID deveria começar com prj_"; exit 1;; esac

          codigo=$(curl -s -o projeto.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          case "$codigo" in
            200) ;;
            401|403) echo "::error::VERCEL_TOKEN inválido, expirado ou sem acesso à conta do VERCEL_ORG_ID (HTTP $codigo)"; exit 1;;
            404) echo "::error::Projeto não encontrado: VERCEL_PROJECT_ID não pertence ao VERCEL_ORG_ID (HTTP 404)"; exit 1;;
            *) echo "::error::Resposta inesperada da Vercel (HTTP $codigo)"; exit 1;;
          esac
          nome=$(jq -r .name projeto.json)
          if [ "$nome" != "$PROJETO_ESPERADO" ]; then
            echo "::error::VERCEL_PROJECT_ID aponta para o projeto '$nome', e não para '$PROJETO_ESPERADO'"
            exit 1
          fi
          echo "OK: token válido; projeto '$nome' encontrado na conta do VERCEL_ORG_ID"
          echo "Git conectado ao projeto: $(jq -r 'if .link then "sim (\(.link.type))" else "não" end' projeto.json)"
