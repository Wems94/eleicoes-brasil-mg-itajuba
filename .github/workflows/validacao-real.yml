# Validação manual com dados reais do TSE: download + staging + marts.
# Roda no runner do GitHub (disco descartável); nada é publicado nem versionado.
name: Validação com dados reais

on:
  workflow_dispatch:
    inputs:
      ano:
        description: Ano da eleição
        type: choice
        options: ["2022", "2018", "2026"]
        default: "2022"
      turnos:
        description: Turnos, separados por espaço
        default: "1 2"

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - name: Liberar espaço em disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Validar
        env:
          ANO: ${{ inputs.ano }}
          TURNOS: ${{ inputs.turnos }}
        run: |
          set -o pipefail
          # $TURNOS sem aspas de propósito: "1 2" vira dois argumentos (o argparse valida como int)
          uv run python scripts/validar_real.py --ano "$ANO" --turnos $TURNOS 2>&1 | tee validacao.log

      - name: Resumo no job
        if: always()
        run: |
          {
            echo '```'
            grep -v ' INFO ' validacao.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
